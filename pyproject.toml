[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codex-auto-compute"
version = "0.1.2"
description = "Conservative Codex worker routing with local usage and outcome evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["codex", "subagents", "model-routing", "usage-tracking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
codex-auto-compute = "codex_auto_compute.cli:main"

[project.urls]
Homepage = "https://github.com/a-ghanim/codex-auto-compute"
Repository = "https://github.com/a-ghanim/codex-auto-compute"
Issues = "https://github.com/a-ghanim/codex-auto-compute/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_auto_compute"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/INSTALL_FOR_CODEX.md", "/LICENSE", "/pyproject.toml"]
